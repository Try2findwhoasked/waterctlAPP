name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认该建议尚未在 [Issues](https://github.com/Try2findwhoasked/waterctlAPP/issues) 中提出过。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你遇到了什么不便？
      placeholder: 例如：每次锁屏后重连要等好几秒，想知道能不能更快
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: 手机型号与系统版本（可选）
      placeholder: 例如 小米 14 / HyperOS 2.0（Android 15）
    validations:
      required: false