      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: waterctl-android-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk   # 修改1：使用通配符，兼容未签名版本
          if-no-files-found: warn                 # 修改2：改为 warn，避免找不到文件直接崩溃

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk   # 修改3：使用通配符
          generate_release_notes: true
          body: |
            安卓原生版蓝牙水控器。

            - `app-release.apk` 或 `app-release-unsigned.apk`：发布版
            - `app-debug.apk`：调试版

            要求 Android 8.0（API 26）及以上。安装前请先在系统设置中允许「安装未知来源应用」。
